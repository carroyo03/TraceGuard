[project]
name = "traceguard"
version = "0.1.0"
description = "Local regression testing for protected document agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
]

[project.scripts]
traceguard = "traceguard.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
